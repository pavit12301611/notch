name: Fedora 45 checks
on:
  push:
  pull_request:

jobs:
  fedora:
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          dnf install -y make git-core python3 python3-gobject gtk4 libadwaita glib2-devel \
            gjs gnome-shell desktop-file-utils nodejs npm dbus-daemon rpm-build
      - run: npm ci
      - run: make stage PREFIX=/usr SYSCONFDIR=/etc
      - name: Compile schemas for GJS smoke tests
        run: |
          mkdir -p .generated/schemas
          cp extension/schemas/*.xml .generated/schemas/
          glib-compile-schemas .generated/schemas
      - run: make check
      - name: GJS/GLib smoke test (not a live Shell test)
        run: GSETTINGS_SCHEMA_DIR="$PWD/.generated/schemas" dbus-run-session -- gjs -m tests/gjs_smoke.js
      - name: Doctor with staged schema
        run: |
          GSETTINGS_SCHEMA_DIR="$PWD/.generated/schemas" PYTHONPATH=app python3 -m notch_app.doctor --offline
          PYTHONPATH=app python3 -c 'import gi; gi.require_version("GLib", "2.0"); from gi.repository import GLib; from notch_app.config import UUID; assert GLib.Variant("(s)", (UUID,)).unpack() == (UUID,)'
      - run: make rpm
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-rpm
          path: dist/rpmbuild/RPMS/noarch/*.rpm
